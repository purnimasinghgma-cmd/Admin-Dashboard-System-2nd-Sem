kind = "web"
previewPath = "/"
title = "Admin Dashboard"
version = "1.0.0"
id = "artifacts/admin-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22133

[services.development]
run = "pnpm --filter @workspace/admin-dashboard run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/admin-dashboard", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/admin-dashboard/server.js"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "22133"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "22133"
BASE_PATH = "/"
